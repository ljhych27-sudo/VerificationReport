[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verreport"
version = "1.0.0"
description = "Google Test / LLVM 커버리지 / CPPCheck / Lizard 결과를 HTML 대시보드로 생성"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
verreport = "verreport.cli:main"

[tool.setuptools]
packages = ["verreport", "verreport.parsers"]
