name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Install package and run CLI
        run: |
          python -m pip install .
          verreport --version
          verreport --demo -o report

  demo-report:
    name: demo report artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate demo report
        run: >
          python -m verreport --demo -o report
          --build-number "${{ github.run_number }}"
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: verreport-demo
          path: report/
          retention-days: 14
